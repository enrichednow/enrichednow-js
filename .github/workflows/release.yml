name: Release

# Pushing a tag vX.Y.Z publishes that version to npm.
#
# No token is stored anywhere: npm trusts this workflow through OpenID Connect ("trusted publishing"), and attaches
# a provenance statement to the package by itself. The package on npm must have a trusted publisher for
# organization "enrichednow", repository "enrichednow-js", workflow "release.yml", environment "npm". Without one
# npm refuses the publish and nothing is uploaded.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'enrichednow/enrichednow-js'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/enrichednow
    permissions:
      contents: read
      id-token: write # the OpenID Connect token npm checks; this job has no other credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # trusted publishing needs npm 11.5.1 or later, which this brings
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # a release is built from nothing
      - name: The tag is the version in package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but package.json says $version"
            exit 1
          fi
          if npm view "enrichednow@$version" version >/dev/null 2>&1; then
            echo "::notice::enrichednow $version is already on npm; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      # prepublishOnly runs the type check, the tests, the build and the import/require smoke test first.
      - run: npm publish --access public
        if: steps.version.outputs.published != 'true'
